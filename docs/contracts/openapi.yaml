      description: airside/landside only on airport projects (§5.3 rule 18).
    ZoneUpdate:
      properties:
        code:
          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9-]{1,16}$
          - type: 'null'
          title: Code
        name_en:
          anyOf:
          - type: string
            maxLength: 150
            minLength: 1
          - type: 'null'
          title: Name En
        name_ar:
          anyOf:
          - type: string
            maxLength: 150
            minLength: 1
          - type: 'null'
          title: Name Ar
        zone_type:
          anyOf:
          - $ref: '#/components/schemas/ZoneType'
          - type: 'null'
