openapi: 3.1.0
info:
  title: HSE Platform API
  description: "\nHSE platform API — Phase 0 Foundation (spec `docs/specs/0-foundation.md` v1.0) and Phase\
    \ 1\nDashboard & core data with AI (spec `docs/specs/1-dashboard.md` v1.0).\n\n* Auth: `POST /api/v1/auth/login`\
    \ sets the httpOnly SameSite=Lax cookie `hse_session` (JWT) and\n  returns `{access_token, user}`.\
    \ Send the cookie or `Authorization: Bearer <token>`.\n* Errors: `{\"detail\": {\"code\", \"message\"\
    , \"message_ar\", \"errors\"}}`; 401 unauthenticated,\n  403 forbidden, 404 not found / out of scope,\
    \ 409 conflict / invalid transition, 422 validation.\n* Lists: `?page=1&page_size=50` → `{items, total,\
    \ page, page_size}`.\n* Timestamps are UTC; display and day boundaries use the project timezone (Asia/Riyadh).\n\
    * Decimals (man-hours, rates, percentages) are JSON strings, already rounded half-up per spec\n  K-R8;\
    \ KPI payloads also carry the exact `display` text. The frontend never recomputes.\n* KPI/dashboard\
    \ endpoints share one filter set (`project_id`, `site_id`, `zone_id`,\n  `zone_type`, `engagement_id`,\
    \ `include_subcontractors`, `tier`, `period`, `anchor`,\n  `start`, `end`, `as_of`, `compare`).\n\
    * `POST /ai/ask` streams Server-Sent Events (schema `AiStreamEvent`).\n"
  version: 0.2.0
paths:
  /api/v1/health:
    get:
      tags:
      - health
      summary: Liveness and database check
      operationId: health
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Log in with email and password
      description: Sets the httpOnly `hse_session` cookie and returns the same JWT. Unknown email and
        wrong password give an identical 401 INVALID_CREDENTIALS. After 5 failures in 15 min the account
        is locked for 15 min (401 ACCOUNT_LOCKED).
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Not authenticated, session expired, or login rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error (field errors in detail.errors).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Log out (revokes the session, clears the cookie)
      operationId: logout
      responses:
        '204':
          description: Successful Response
        '401':
          description: Not authenticated, session expired, or login rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - sessionCookie: []
      - bearerAuth: []
