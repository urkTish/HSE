components:
  schemas:
    AcceptedResponse:
      properties:
        accepted:
          type: boolean
          const: true
          title: Accepted
          default: true
        message:
          type: string
          title: Message
          description: Generic message; never reveals whether the email exists.
      type: object
      required:
      - message
      title: AcceptedResponse
    AirsideArea:
      type: string
      enum:
      - runway
      - runway_strip
      - resa
      - taxiway
      - taxiway_strip
      - apron
      - ils_critical
      - ils_sensitive
      - airside_road
      - other_airside
      title: AirsideArea
    AirsideAttributes:
      properties:
        airside_area:
          $ref: '#/components/schemas/AirsideArea'
        in_movement_area:
          type: boolean
          title: In Movement Area
        runway_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Runway Ref
        security_restricted_area:
          type: boolean
          title: Security Restricted Area
        notam_required_for_works:
          type: boolean
          title: Notam Required For Works
        ols_height_limit_m_amsl:
          anyOf:
          - type: number
          - type: 'null'
          title: Ols Height Limit M Amsl
        max_equipment_height_m_agl:
          anyOf:
          - type: number
          - type: 'null'
          title: Max Equipment Height M Agl
        escort_required:
          type: boolean
          title: Escort Required
        adp_required:
          type: boolean
          title: Adp Required
        fod_control_required:
          type: boolean
          title: Fod Control Required
        works_safety_plan_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Works Safety Plan Ref
      type: object
      required:
      - airside_area
      - in_movement_area
      - runway_ref
      - security_restricted_area
      - notam_required_for_works
      - ols_height_limit_m_amsl
      - max_equipment_height_m_agl
      - escort_required
      - adp_required
      - fod_control_required
      - works_safety_plan_ref
      title: AirsideAttributes
    AirsideAttributesInput:
      properties:
        airside_area:
          $ref: '#/components/schemas/AirsideArea'
        in_movement_area:
          type: boolean
          title: In Movement Area
          description: Must be true for runway, runway_strip, resa, taxiway, taxiway_strip, apron.
        runway_ref:
          anyOf:
          - type: string
            pattern: ^\d{2}[LRC]?/\d{2}[LRC]?$
          - type: 'null'
          title: Runway Ref
          examples:
          - 15L/33R
        security_restricted_area:
          type: boolean
          title: Security Restricted Area
          default: true
        notam_required_for_works:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Notam Required For Works
          description: Defaults to in_movement_area when omitted.
        ols_height_limit_m_amsl:
          anyOf:
          - type: number
            maximum: 3000.0
            minimum: 0.0
          - type: 'null'
          title: Ols Height Limit M Amsl
        max_equipment_height_m_agl:
          anyOf:
          - type: number
            maximum: 300.0
            minimum: 0.0
          - type: 'null'
          title: Max Equipment Height M Agl
        escort_required:
          type: boolean
          title: Escort Required
        adp_required:
          type: boolean
          title: Adp Required
          description: Airside driving permit required.
        fod_control_required:
          type: boolean
          title: Fod Control Required
          default: true
        works_safety_plan_ref:
          anyOf:
          - type: string
            maxLength: 40
          - type: 'null'
          title: Works Safety Plan Ref
      additionalProperties: false
      type: object
      required:
      - airside_area
      - in_movement_area
      - escort_required
      - adp_required
      title: AirsideAttributesInput
      description: Airside attribute block (§3.3). Required iff zone_type = airside, else must be null.
    AuditAction:
      type: string
      enum:
      - login_success
      - login_failed
      - logout
      - account_locked
      - password_reset_requested
      - password_changed
      - mfa_changed
      - user_invited
      - user_status_changed
      - role_assigned
      - role_revoked
      - create
      - update
      - status_change
      - archive
      - settings_changed
      - sensitive_field_read
      - export
      - access_denied
      - audit_log_viewed
      - audit_chain_verified
      - retention_purge
      - privacy_notice_acknowledged
      title: AuditAction
      description: 'Audited actions (§5.6 rule 35, plus privacy_notice_acknowledged and

        audit_chain_verified).'
    AuditChainVerification:
      properties:
        ok:
          type: boolean
          title: Ok
        checked_count:
          type: integer
          title: Checked Count
        first_break_seq:
          anyOf:
          - type: integer
          - type: 'null'
          title: First Break Seq
          description: Sequence of the first broken entry.
        first_break_entry_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: First Break Entry Id
        verified_at:
          type: string
          format: date-time
          title: Verified At
      type: object
      required:
      - ok
      - checked_count
      - first_break_seq
      - first_break_entry_id
      - verified_at
      title: AuditChainVerification
    AuditEntryPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AuditEntryRead'
          type: array
          title: Items
        total:
          type: integer
          title: Total
          description: Total number of matching items across all pages.
        page:
          type: integer
          title: Page
          description: 1-based page number.
        page_size:
          type: integer
          title: Page Size
          description: Items per page (max 200).
      type: object
      required:
      - items
      - total
      - page
      - page_size
      title: AuditEntryPage
    AuditEntryRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        seq:
          type: integer
          title: Seq
          description: Monotonic sequence number in the hash chain.
        occurred_at:
          type: string
          format: date-time
          title: Occurred At
        actor_user_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Actor User Id
          description: Null = system job.
        actor_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor Name
        actor_role:
          anyOf:
          - $ref: '#/components/schemas/Role'
          - type: 'null'
        on_behalf_project_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: On Behalf Project Id
        ip_address:
          anyOf:
          - type: string
          - type: 'null'
          title: Ip Address
          description: HSE Manager only (rule 38).
        user_agent:
          anyOf:
          - type: string
          - type: 'null'
          title: User Agent
          description: HSE Manager only (rule 38).
        action:
          $ref: '#/components/schemas/AuditAction'
        entity_type:
          anyOf:
          - $ref: '#/components/schemas/EntityType'
          - type: 'null'
        entity_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Entity Id
        project_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Project Id
        before:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Before
          description: Changed fields only; sensitive = '***'.
        after:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: After
        fields_read:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Fields Read
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Details
          description: 'Extra context: reason, export row count/filter, purge range, denied path.'
        result:
          $ref: '#/components/schemas/AuditResult'
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
        prev_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Prev Hash
          description: HSE Manager only.
        hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Hash
          description: HSE Manager only.
      type: object
      required:
      - id
      - seq
      - occurred_at
      - actor_user_id
      - actor_name
      - actor_role
      - on_behalf_project_id
      - action
      - entity_type
      - entity_id
      - project_id
      - before
      - after
      - fields_read
      - details
      - result
      - request_id
      title: AuditEntryRead
    AuditResult:
      type: string
      enum:
      - success
      - denied
      - failed
      title: AuditResult
    Capability:
