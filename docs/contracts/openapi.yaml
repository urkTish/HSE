          format: uuid
          title: Id
        project_id:
          type: string
          format: uuid
          title: Project Id
        site_id:
          type: string
          format: uuid
          title: Site Id
        code:
          type: string
          title: Code
        name_en:
          type: string
          title: Name En
        name_ar:
          type: string
          title: Name Ar
        zone_type:
