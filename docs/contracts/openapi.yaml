openapi: 3.1.0
info:
  title: HSE Platform API
  description: "\nHSE platform API — Phase 0 Foundation (spec `docs/specs/0-foundation.md` v1.0).\n\n\
    * Auth: `POST /api/v1/auth/login` sets the httpOnly SameSite=Lax cookie `hse_session` (JWT) and\n\
    \  returns `{access_token, user}`. Send the cookie or `Authorization: Bearer <token>`.\n* Errors:\
    \ `{\"detail\": {\"code\", \"message\", \"message_ar\", \"errors\"}}`; 401 unauthenticated,\n  403\
    \ forbidden, 404 not found / out of scope, 409 conflict / invalid transition, 422 validation.\n* Lists:\
    \ `?page=1&page_size=50` → `{items, total, page, page_size}`.\n* Timestamps are UTC; display and day\
    \ boundaries use the project timezone (Asia/Riyadh).\n"
  version: 0.1.0
paths:
  /api/v1/health:
    get:
      tags:
      - health
      summary: Liveness and database check
      operationId: health
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Log in with email and password
      description: Sets the httpOnly `hse_session` cookie and returns the same JWT. Unknown email and
        wrong password give an identical 401 INVALID_CREDENTIALS. After 5 failures in 15 min the account
        is locked for 15 min (401 ACCOUNT_LOCKED).
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Not authenticated, session expired, or login rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error (field errors in detail.errors).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Log out (revokes the session, clears the cookie)
      operationId: logout
      responses:
        '204':
          description: Successful Response
        '401':
          description: Not authenticated, session expired, or login rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - sessionCookie: []
      - bearerAuth: []
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Current user with resolved roles and capabilities
      operationId: get_me
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: Not authenticated, session expired, or login rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing capability, read-only role, contractor suspended, or privacy notice not
            acknowledged (PRIVACY_ACK_REQUIRED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - sessionCookie: []
      - bearerAuth: []
    patch:
      tags:
      - auth
      summary: Edit own profile (name, mobile, language)
      operationId: update_me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeUpdate'
        required: true
