        \ HSE Manager (I-12).\n* medical (capability 30): illness, body_part, body_side, nature, treatments,\n\
        \  loss_of_consciousness, treated_at, fatal, date_of_death, absence/restriction/transfer\n  dates,\
        \ permanent_disability, privacy_case, privacy_reason, day_counts, medical_notes.\n\nEvery read\
        \ that returns identity or medical fields writes a `sensitive_field_read` audit\nentry listing\
