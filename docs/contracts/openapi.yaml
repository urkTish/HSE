      description: "§4.2 transitions:\n\n* draft → reported (reporter): all required fields; injury needs\
        \ ≥ 1 case\n  (`INJURY_CASE_REQUIRED`); near_miss alone (`NEAR_MISS_EXCLUSIVE`).\n* reported →\
        \ under_investigation (HSE Officer/Manager): `investigation` required.\n* reported → closed (L1\
        \ quick close, HSE Officer): level L1 and no CA required; `reason`.\n* under_investigation → pending_review\
        \ (lead): investigation complete\n  (`INVESTIGATION_INCOMPLETE`, rule I-16).\n* pending_review\
        \ → under_investigation (approver): `reason` = return comment.\n* pending_review → actions_pending\
        \ | closed (approver; L3 HSE Manager only): all cases\n  confirmed (`CASES_NOT_CONFIRMED`); I-17\
        \ (`HIGHER_CONTROL_REQUIRED` unless\n  `higher_control_justification`); approver ≠ lead (`APPROVER_IS_LEAD`).\n\
        * reported/under_investigation → voided (HSE Officer/Manager): `reason`.\n* closed → under_investigation,\
        \ voided → reported (HSE Manager): `reason`."
