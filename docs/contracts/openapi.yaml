            pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,8}|(?=[\d.]{1,11}0*$)\d{0,8}\.\d{0,2}0*$)
          - type: 'null'
          title: Man Hours
        toolbox_talks:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Toolbox Talks
        toolbox_attendees:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Toolbox Attendees
        inductions:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Inductions
        training_hours:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,6}|(?=[\d.]{1,9}0*$)\d{0,6}\.\d{0,2}0*$)
          - type: 'null'
          title: Training Hours
        remarks:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Remarks
          description: Do not enter names, ID or medical details (P3).
      additionalProperties: false
      type: object
      title: WorkforceReturnUpdate
      description: 'Edit a draft or submitted row (status unchanged; same validations as create). Verified

        rows → 409 INVALID_TRANSITION (move back to submitted first); locked rows → 409

        PERIOD_LOCKED (HSE Manager unlocks the row first).'
    WorkforceSource:
      type: string
      enum:
      - manual
      - import
      title: WorkforceSource
    WorkforceStatus:
      type: string
      enum:
      - draft
      - submitted
      - verified
      - locked
      title: WorkforceStatus
      description: §4.1. KPIs use submitted, verified and locked rows; drafts are excluded.
    WorkforceTransitionRequest:
      properties:
        to_status:
          $ref: '#/components/schemas/WorkforceStatus'
        reason:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Reason
      additionalProperties: false
      type: object
      required:
      - to_status
      title: WorkforceTransitionRequest
      description: '§4.1: draft→submitted; submitted→draft (creator, HSE Officer); submitted→verified

        (HSE Officer/Manager, verifier ≠ creator → `VERIFIER_IS_CREATOR`); verified→submitted

        (correction, reason); locked→verified (HSE Manager, reason; marks the month restated).'
    ZoneCreate:
