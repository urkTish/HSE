        airside:
          anyOf:
          - $ref: '#/components/schemas/AirsideAttributesInput'
          - type: 'null'
          description: Required iff zone_type = airside; must be null otherwise.
      additionalProperties: false
      type: object
      required:
      - code
      - name_en
      - name_ar
      - zone_type
      title: ZoneCreate
    ZonePage:
      properties:
        items:
