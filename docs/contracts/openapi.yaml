  /api/v1/ai/ask:
    post:
      tags:
      - ai
      summary: Ask the HSE assistant (streamed)
      description: "Answers strictly from tool results (KPI engine and read-only query services, executed\
        \ with the\ncaller's identity and scope). Prompts are masked for IDs/emails/+966 mobiles before\
        \ sending\n(AI-15); no person names or medical data are ever sent to the model (AI-5).\n\n**Response\
        \ formats** (choose with `Accept`):\n\n* `text/event-stream` (default): Server-Sent Events, one\
        \ JSON `data:` per event, see schema\n  `AiStreamEvent`. Sequence: `meta` → `status`* → `delta`*\
        \ → `citations` → `chart`? →\n  `recommendations`? → `done` (full `AiAnswer`). `error` ends the\
        \ stream. Answer text is only\n  streamed after the number-grounding check (AI-2) passed, so no\
        \ unverified number is ever\n  displayed.\n* `application/json`: the final `AiAnswer` in one response.\n\
        \nErrors before the stream starts are JSON: 403 `AI_DISABLED` (ai_enabled false or no transfer\n\
        approval, AC73), 403 capability 40, 404 project out of scope, 429 `AI_RATE_LIMITED` (60\nquestions/user/day,\
        \ `Retry-After`), 503 `AI_UNAVAILABLE` (no API key configured / provider\ndown)."
      operationId: ai_ask
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiAskRequest'
        required: true
      responses:
        '200':
          description: SSE stream (text/event-stream) or the final answer (application/json).
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/AiStreamEvent'
            application/json:
              schema:
                $ref: '#/components/schemas/AiAnswer'
        '401':
          description: Not authenticated, session expired, or login rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing capability, read-only role, contractor suspended, or privacy notice not
            acknowledged (PRIVACY_ACK_REQUIRED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found or outside the caller's project/contractor scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error (field errors in detail.errors).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit reached (AI_RATE_LIMITED); see Retry-After.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Dependency unavailable (AI_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - sessionCookie: []
      - bearerAuth: []
