        audited with before/after (rule 21).'
    AiStreamDelta:
      properties:
        text:
          description: Next chunk of the verified answer text (append).
          title: Text
          type: string
      required:
      - text
      title: AiStreamDelta
      type: object
    AiStreamError:
      properties:
        code:
          examples:
          - AI_UNAVAILABLE
          title: Code
          type: string
        message:
          title: Message
          type: string
        message_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Message Ar
      required:
      - code
      - message
      - message_ar
      title: AiStreamError
      type: object
    AiStreamEvent:
      description: 'One SSE frame of POST /ai/ask (`Content-Type: text/event-stream`):


        ```

        event: <event>

        data: <JSON of `data`>


        ```


        Order: `meta` (once) → `status`* (progress: tool calls, grounding check) → `delta`*

        (verified answer text, sent only after the AI-2 grounding check passed) → `citations`,

        `chart` (optional), `recommendations` (optional) → `done` (the full `AiAnswer`, the

        source of truth; replace what was rendered from deltas). On the AI-2 second failure the

        deltas carry the fallback message and `done.fallback_table` holds the raw tool table.

        Errors after the stream started arrive as `error` (e.g. AI_UNAVAILABLE on provider

        timeout) and end the stream. Errors before streaming (AI_DISABLED 403, AI_UNAVAILABLE 503,

        AI_RATE_LIMITED 429, scope 404) are normal JSON error responses.

        A `: keep-alive` comment line is sent every 15 s.'
      properties:
        event:
          enum:
          - meta
          - status
          - delta
          - citations
          - chart
          - recommendations
          - done
          - error
          title: Event
          type: string
        data:
          anyOf:
          - $ref: '#/components/schemas/AiStreamMeta'
          - $ref: '#/components/schemas/AiStreamStatus'
          - $ref: '#/components/schemas/AiStreamDelta'
          - items:
              $ref: '#/components/schemas/AiCitation'
            type: array
          - $ref: '#/components/schemas/ChartSpec'
          - items:
              $ref: '#/components/schemas/AiRecommendation'
            type: array
          - $ref: '#/components/schemas/AiAnswer'
          - $ref: '#/components/schemas/AiStreamError'
          title: Data
      required:
      - event
      - data
      title: AiStreamEvent
      type: object
    AiStreamMeta:
      properties:
        answer_id:
          format: uuid
          title: Answer Id
          type: string
        conversation_id:
          format: uuid
          title: Conversation Id
          type: string
        model:
          title: Model
          type: string
        prompt_warnings:
          items:
            $ref: '#/components/schemas/AiPromptWarning'
          title: Prompt Warnings
          type: array
        question_masked:
          title: Question Masked
          type: string
      required:
      - answer_id
      - conversation_id
      - model
      - prompt_warnings
      - question_masked
      title: AiStreamMeta
      type: object
    AiStreamStatus:
      properties:
        stage:
          enum:
          - thinking
          - tool
          - grounding
          - regenerating
          - writing
          title: Stage
          type: string
        tool:
          anyOf:
          - $ref: '#/components/schemas/AiTool'
          - type: 'null'
          default: null
        message_en:
          title: Message En
          type: string
        message_ar:
          title: Message Ar
          type: string
      required:
      - stage
      - message_en
      - message_ar
      title: AiStreamStatus
      type: object
  securitySchemes:
