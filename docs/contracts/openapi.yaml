      - project.view
      - site_zone.manage
      - site_zone.view
      - contractor.create
      - contractor.approve
      - engagement.manage
      - contractor.view
      - contractor.view_contacts
      - user.invite
      - user.view_directory
      - user.view_contacts
      - user.manage_status
      - settings.edit
      - settings.view
