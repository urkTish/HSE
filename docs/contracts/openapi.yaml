      description: "§4.5:\n\n* open → in_progress (owner: accept)\n* open/in_progress → pending_verification\
        \ (owner): evidence_text ≥ 20 chars or ≥ 1\n  evidence attachment, else `EVIDENCE_REQUIRED`; sets\
        \ completed_at\n* pending_verification → closed (verifier): sets verified_at; verifier = owner\
