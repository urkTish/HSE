# Local development stack: `docker compose up` (see docs/CONVENTIONS.md).
# Copy .env.example to .env first; never commit .env.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hse}
      POSTGRES_DB: ${POSTGRES_DB:-hse}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hse} -d ${POSTGRES_DB:-hse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hse-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hse-minio-dev-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  backend:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hse}:${POSTGRES_PASSWORD:-hse}@db:5432/${POSTGRES_DB:-hse}
      S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

  scheduler:
    build:
      context: ./backend
    command: ["python", "-m", "app.scheduler"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hse}:${POSTGRES_PASSWORD:-hse}@db:5432/${POSTGRES_DB:-hse}
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db-data:
  minio-data:
