name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hse
          POSTGRES_PASSWORD: hse
          POSTGRES_DB: hse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hse -d hse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://hse:hse@localhost:5432/hse_test
      TEST_DATABASE_URL: postgresql+psycopg://hse:hse@localhost:5432/hse_test
      ENVIRONMENT: test
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff format)
        run: uv run ruff format --check .
      - name: Typecheck (mypy)
        run: uv run mypy app
      - name: Migrations apply cleanly and match the models
        run: uv run alembic upgrade head && uv run alembic check
      - name: Tests (pytest)
        run: uv run pytest
      - name: Contract is up to date
        run: uv run python -m app.export_openapi --check

  # ---------------------------------------------------------------------------
  # FRONTEND JOB — owned by the Frontend Agent. Add the `frontend` job here
  # (lint, typecheck, i18n key check, build, Playwright e2e).
  # ---------------------------------------------------------------------------
