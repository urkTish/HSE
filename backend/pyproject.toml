[project]
name = "hse-backend"
version = "0.1.0"
description = "HSE platform backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.11.0",
    "apscheduler>=3.11.3",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "fpdf2>=2.8.9",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0",
    "tzdata>=2026.5",
    "uharfbuzz>=0.56.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "PL"]
ignore = [
  "PLR0913",  # FastAPI handlers naturally take many params
  "PLR2004",  # magic values are fine in tests/validators
  "PLR0911",
  "PLR0912",
  "PLR0915",
  "PLR0917",  # FastAPI handlers take many query params
  "S105",     # enum values like "password_changed" are not secrets
  "UP046",    # keep typing.Generic for pydantic generic models
  "UP047",
  "B008",     # FastAPI Depends() in defaults
  "RUF001", "RUF002", "RUF003",  # Arabic text is intentional
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "S311", "N802", "PLC0415", "S608"]
"alembic/**" = ["N999"]
"app/seed_hse.py" = ["S311"]  # deterministic demo data, not security
"app/seed_access.py" = ["S311", "C408"]  # deterministic demo data; dict() rows read as tables
"app/seed_ptw*.py" = ["S311", "S101", "S107", "PLC0415"]  # deterministic demo data; plan invariants asserted
"app/seed_cert.py" = ["S311", "E501", "N806"]  # deterministic demo data; table-like rows
"app/seed_field.py" = ["S311", "S101", "PLC0415", "E501"]  # deterministic demo data; table-like rows
"tests/test_ptw*.py" = ["E501"]  # one-line fixture bodies mirror the spec tables
"tests/ptw_helpers.py" = ["E501"]
"tests/test_cert*.py" = ["E501"]  # one-line fixture bodies mirror the spec tables
"tests/cert_helpers.py" = ["E501"]
"tests/test_field*.py" = ["E501"]  # one-line fixture bodies mirror the spec tables
"tests/field_helpers.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Security"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["openpyxl.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
